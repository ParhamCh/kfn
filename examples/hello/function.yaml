# hello — a minimal kfn function that returns a JSON greeting.
# Build & deploy:
#   kfn build -f examples/hello/function.yaml --func ./examples/hello
#   kfn push  -f examples/hello/function.yaml
#   kfn apply -f examples/hello/function.yaml
#
# Only `name` and `image` are required; every other field below is shown at its default.
name: hello
image: harbor.lan/kfn/hello:0.2.2
port: 8080            # default 8080
replicas: 2
resources:
  requests:
    cpu: 50m          # defaults: requests 50m / 64Mi, limits 250m / 128Mi
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
env:
  - name: LOG_LEVEL
    value: info
# Expose at https://hello.kfn.lan through ingress-nginx, TLS issued by cert-manager.
ingress:
  enabled: true
  host: hello.kfn.lan        # default <name>.kfn.lan
  tls: true                  # cert-manager issues a cert into <name>-tls
  # clusterIssuer: cm-lab-ca   (default)
  # className: nginx           (default)
# Prometheus metrics are on by default (/metrics on :9090 + a ServiceMonitor).
monitoring:
  interval: 10s              # scrape every 10s so a 30s RPS window has >=2 samples (rate needs that)
  # enabled: true            (default; false drops the metrics port + ServiceMonitor)
  # releaseLabel: kps        (default; the label the prometheus-operator selects on)
