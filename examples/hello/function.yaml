# Function metadata consumed by `kfn render` / `kfn apply`.
# Unset fields are defaulted: namespace=kfn, nodeSelector role=workload, port=8080,
# replicas=1, resources (50m/64Mi requests, 250m/128Mi limits), shutdownGrace=15s.
name: hello
image: harbor.lan/kfn/hello:0.1.0  # built and pushed via `kfn build` / `kfn push`
port: 8080
replicas: 2
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
env:
  - name: LOG_LEVEL
    value: info
ingress:
  enabled: true
  host: hello.kfn.lan      # default <name>.kfn.lan
  # tls: true              (default; cert-manager issues into <name>-tls)
  # clusterIssuer: cm-lab-ca   (default)
  # className: nginx           (default)
